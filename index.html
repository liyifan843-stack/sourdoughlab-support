<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sourdough Lab for Mac 支持</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #fff8ee; color: #2b2117; }
    main { max-width: 920px; margin: 0 auto; padding: 56px 24px; }
    .hero { background: linear-gradient(135deg, #ffe7a8, #df8738); border-radius: 28px; padding: 44px; }
    h1 { margin: 0 0 12px; font-size: 46px; }
    .muted { color: #6d5842; font-size: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-top: 26px; }
    .card { background: white; border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px #8b5a2318; }
    a { color: #a95714; }
    footer { margin: 34px 0; color: #7b6854; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div>Sourdough Lab for Mac</div>
      <h1>让烘焙百分比变得清晰。</h1>
      <p class="muted">天然酵种配方计算、发酵时间线和 CSV 记录，全部在 Mac 本机完成。</p>
    </section>
    <section class="grid">
      <article class="card"><h2>精确计算</h2><p>根据面粉总量和烘焙百分比计算水、盐、酵种和总面团重量。</p></article>
      <article class="card"><h2>酵种拆分</h2><p>区分酵种面粉与酵种水，避免重复计算总含水量。</p></article>
      <article class="card"><h2>可重复记录</h2><p>导出 CSV 配方，保存参数、原料重量和从混合到入炉的时间线。</p></article>
    </section>
    <footer>© 2026 Sourdough Lab · <a href="privacy.html">隐私政策</a> · <a href="support.html">帮助中心</a></footer>
  </main>
</body>
</html>
