    <h1>Sourdough Lab 帮助中心</h1>
    <h2>如何计算酵种？</h2>
    <p>酵种面粉 = 酵种总重量 ÷ (1 + 酵种含水量)。酵种水 = 酵种总重量 - 酵种面粉。额外配方水只补足目标总水量。</p>
    <h2>为什么额外水量变少？</h2>
    <p>目标总水量已经包含酵种内部水分。如果酵种含水量很高，请提高目标含水量或降低酵种比例。</p>
    <h2>如何导出配方？</h2>
    <p>完成计算后点击 <code>Export CSV</code>，选择本机保存位置。文件包含参数、原料重量和完整时间线。</p>
